# Render Blueprint — deploys MatchThread as a single service. See
# DEPLOY.md for the full walkthrough and the $0-vs-$7/mo tradeoff.
#
# This is intentionally ONE web service, not four: server.ts merges the
# Next.js app, the WebSocket gateway, and both background pollers into one
# process (see its own doc comment for why), and Postgres/Redis are
# external rather than Render-managed — Neon's Postgres free tier never
# expires, and Redis isn't needed at all once everything's one process
# (lib/redis/pubsub.ts and lib/redis/cache.ts fall back to in-process
# alternatives when REDIS_URL is unset). That's what gets this down to
# one service instead of ~$45/mo across 6 Render resources.
#
# In the Render dashboard: New -> Blueprint -> connect this repo. Fields
# marked `sync: false` are secrets Render will prompt you to paste in
# (never put real secrets in this file — it's committed to the repo).

services:
  - type: web
    name: matchthread
    runtime: node
    plan: free # switch to `starter` ($7/mo) later for no idle spin-down — see DEPLOY.md; no code change needed either way
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Neon (or any Postgres) connection string — see DEPLOY.md
      - key: AUTH_SECRET
        sync: false # generate with `npx auth secret`
      - key: NEXTAUTH_URL
        sync: false # this service's own public URL, e.g. https://matchthread.onrender.com
      - key: NEXT_PUBLIC_WS_URL
        sync: false # same URL as NEXTAUTH_URL but wss:// — see DEPLOY.md, must be set before the build that ships it
      - key: OPENAI_API_KEY
        sync: false
      - key: FETCHLAYER_API_KEY
        sync: false
      # REDIS_URL intentionally omitted — see the file doc comment above.
      # Add it back only if you split this into multiple services later.
